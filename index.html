<!DOCTYPE html>
<html lang="ru">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, height=device-height, initial-scale=1.0, user-scalable=no, shrink-to-fit=yes">
    <meta name="theme-color" content="#0B0E14">
    <title>XCRAFT</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='12' fill='%230B0E14'/%3E%3Cpath d='M14 14 L32 32 L50 14 M14 50 L32 32 L50 50' stroke='%2300F0FF' stroke-width='7' stroke-linecap='round' fill='none'/%3E%3C/svg%3E">
    <style>
      html, body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: #0B0E14;
        color: #E2E8F0;
        font-family: "Segoe UI", Roboto, Arial, sans-serif;
      }

      #game-canvas {
        position: fixed;
        inset: 0;
        width: 100vw;
        height: 100vh;
        display: block;
        background: #0B0E14;
        outline: none;
      }

      #loader {
        position: fixed;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        background: radial-gradient(ellipse at center, #0F172A 0%, #0B0E14 70%);
        transition: opacity 0.4s ease;
        z-index: 2;
      }

      #loader.hidden {
        opacity: 0;
        pointer-events: none;
      }

      #loader-title {
        font-size: 56px;
        font-weight: 800;
        letter-spacing: 14px;
        color: #00F0FF;
        text-shadow: 0 0 24px rgba(0, 240, 255, 0.45);
        margin-left: 14px;
      }

      #loader-subtitle {
        margin-top: 8px;
        font-size: 12px;
        letter-spacing: 5px;
        color: #8CA2BF;
        text-transform: uppercase;
      }

      #loader-bar {
        margin-top: 36px;
        width: min(420px, 70vw);
        height: 6px;
        border-radius: 3px;
        background: rgba(148, 163, 184, 0.15);
        overflow: hidden;
      }

      #loader-fill {
        width: 0%;
        height: 100%;
        border-radius: 3px;
        background: linear-gradient(90deg, #8B5CF6, #00F0FF);
        transition: width 0.2s ease;
      }

      #loader-status {
        margin-top: 12px;
        font-size: 12px;
        letter-spacing: 2px;
        color: #8CA2BF;
      }

      #notice {
        position: fixed;
        left: 50%;
        top: 16px;
        transform: translateX(-50%);
        max-width: 80vw;
        z-index: 3;
      }

      #notice div {
        margin-bottom: 8px;
        padding: 10px 16px;
        border-radius: 6px;
        font-size: 13px;
        background: rgba(13, 17, 23, 0.95);
        border: 1px solid rgba(0, 240, 255, 0.4);
      }

      #notice div.error {
        border-color: #FF3366;
        color: #FF3366;
      }
    </style>
  </head>
  <body>
    <canvas id="game-canvas" tabindex="-1"></canvas>

    <div id="loader">
      <div id="loader-title">XCRAFT</div>
      <div id="loader-subtitle">Сектор Копрулу · онлайн-стратегия</div>
      <div id="loader-bar"><div id="loader-fill"></div></div>
      <div id="loader-status">ЗАГРУЗКА 0%</div>
    </div>

    <div id="notice"></div>

    <script>
      var canvas = document.querySelector("#game-canvas");
      var loader = document.querySelector("#loader");
      var fill = document.querySelector("#loader-fill");
      var status = document.querySelector("#loader-status");

      // сообщения движка: предупреждения исчезают сами, ошибка остаётся
      function showNotice(message, type) {
        var box = document.querySelector("#notice");
        var item = document.createElement("div");
        item.textContent = message;
        if (type === "error") item.className = "error";
        box.appendChild(item);
        if (type !== "error") {
          setTimeout(function () { if (item.parentNode) item.parentNode.removeChild(item); }, 5000);
        }
      }

      var buildUrl = "Build";
      var loaderUrl = buildUrl + "/b7cd54a21deab485895300723cac4d6e.loader.js";
      var config = {
        arguments: [],
        dataUrl: buildUrl + "/71b7c4102b709d01845ded337e726d4e.data.unityweb",
        frameworkUrl: buildUrl + "/f626aa6ddc7424fd95d143ac178b183e.framework.js.unityweb",
        codeUrl: buildUrl + "/537ad2cfd0824b00dc601ee7460e8e24.wasm.unityweb",
        streamingAssetsUrl: "StreamingAssets",
        companyName: "PANTHEON",
        productName: "XCRAFT",
        productVersion: "0.1.0",
        showBanner: showNotice,
        autoSyncPersistentDataPath: true
      };

      // игра заполняет всё окно браузера; на телефонах — без лишнего масштаба
      if (/iPhone|iPad|iPod|Android/i.test(navigator.userAgent)) {
        config.devicePixelRatio = Math.min(window.devicePixelRatio || 1, 2);
      }

      var script = document.createElement("script");
      script.src = loaderUrl;
      script.onload = function () {
        createUnityInstance(canvas, config, function (progress) {
          var percent = Math.round(progress * 100);
          fill.style.width = percent + "%";
          status.textContent = percent < 100 ? "ЗАГРУЗКА " + percent + "%" : "ЗАПУСК…";
        }).then(function () {
          loader.classList.add("hidden");
          setTimeout(function () { loader.style.display = "none"; }, 450);
          canvas.focus();
        }).catch(function (message) {
          status.textContent = "ОШИБКА ЗАПУСКА";
          showNotice(String(message), "error");
        });
      };
      script.onerror = function () {
        status.textContent = "НЕ УДАЛОСЬ ЗАГРУЗИТЬ ИГРУ";
        showNotice("Проверьте подключение к интернету и обновите страницу.", "error");
      };
      document.body.appendChild(script);
    </script>
  </body>
</html>
